<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NeonPlan 3D – Supporter-Stadt</title>
    <meta name="description" content="Eine kleine Neon-Stadt bei Nacht: Jedes Licht ist ein Mensch, der NeonPlan 3D unterstützt." />
    <style>
      :root {
        --glass: rgba(10, 18, 34, 0.78);
        --line: rgba(120, 190, 255, 0.22);
        --text: #e7f0ff;
        --muted: #8ea3c4;
        --cyan: #22d3ee;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04070e;
        color: var(--text);
        font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #city {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #city canvas {
        display: block;
      }
      #city-ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #city-ui > * {
        pointer-events: auto;
      }
      .bar {
        position: absolute;
        top: 12px;
        left: 16px;
        right: 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--glass);
        backdrop-filter: blur(10px);
      }
      .back {
        color: var(--cyan);
        text-decoration: none;
        white-space: nowrap;
      }
      .titles {
        display: grid;
        flex: 1;
        min-width: 180px;
      }
      .titles b {
        font-size: 17px;
      }
      .count {
        color: var(--cyan);
        font-size: 13px;
      }
      .find input {
        width: min(280px, 70vw);
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(4, 8, 18, 0.7);
        color: var(--text);
        font: inherit;
      }
      .note {
        position: absolute;
        top: 86px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(251, 191, 36, 0.14);
        border: 1px solid rgba(251, 191, 36, 0.45);
        color: #fde68a;
        font-size: 12px;
        white-space: nowrap;
      }
      .hint {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
        pointer-events: none;
      }
      .card {
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 220px;
        max-width: calc(100vw - 32px);
        box-sizing: border-box;
        padding: 12px 18px;
        border: 1px solid var(--c, var(--cyan));
        border-radius: 16px;
        background: var(--glass);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 24px color-mix(in srgb, var(--c, var(--cyan)) 30%, transparent);
      }
      .card[hidden] {
        display: none;
      }
      .card i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--c, var(--cyan));
        box-shadow: 0 0 12px var(--c, var(--cyan));
        flex: none;
      }
      .card div {
        display: grid;
      }
      .card span {
        font-size: 18px;
        color: var(--c, var(--cyan));
      }
      .card small {
        color: var(--muted);
      }
      @media (max-width: 560px) {
        .note {
          top: 132px;
        }
      }
    </style>
  </head>
  <body>
    <div id="city"></div>
    <div id="city-ui"></div>
    <script type="module" src="./neonplan3d-city.js"></script>
  </body>
</html>
